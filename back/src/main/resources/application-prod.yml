# DeepSeek AI 说明：
# -----------------------------------------------------------------------------
# 1. 原 spring.ai.deepseek.api-key 已移除：api-key 不再写死在配置文件中，避免泄漏与启动强校验。
# 2. ProjectApplication 中已通过 exclude = DeepSeekChatAutoConfiguration.class 禁用 DeepSeek 自动配置，
#    因此这里无需配置 spring.ai.deepseek.*，项目启动时也不会对 api-key 做任何检测。
# 3. 每个用户在系统前端“AI 助手 → API Key 设置”中自行导入自己的深度求索(DeepSeek) API Key，
#    后端按用户维度存入 Redis（key 前缀 ai:apikey:），运行时由 AiService 动态构建 ChatClient。
# -----------------------------------------------------------------------------

# JWT配置 (至少64字符以满足HS512的512位要求)
config:
    jwt:
        secret: ThisIsAVeryLongAndSecureSecretKeyForJWTTokenSigningThatMustBeAtLeastSixtyFourCharactersLongToMeetHS512Requirements12345678901234567890
        expire: 86400

# 端口
server:
    port: 8080

# 生产环境关闭OpenAPI
springdoc:
    api-docs:
        enabled: false
    swagger-ui:
        enabled: false
